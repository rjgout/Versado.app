apply plugin: 'com.android.application'

// Versie en uploadsleutel komen uit Gradle-properties of de omgeving (CI-secrets), nooit uit git.
// Zonder uploadsleutel blijft een releasebuild ongetekend: er is geen terugval naar de debugsleutel.
def versadoSetting = { String name, String fallback ->
    def value = rootProject.findProperty(name) ?: System.getenv(name)
    return value ? value.toString() : fallback
}
def uploadKeystorePath = versadoSetting("VERSADO_UPLOAD_KEYSTORE_PATH", "")

// Verdediging in de diepte (WP3): de uploadsleutel tekent uitsluitend een bundel die bij het profiel
// local-store-test (kanaal play-test) hoort, geen compileproef is en niet release-goedgekeurd is. De workflow
// en scripts/native/android-release-guard.mjs controleren hetzelfde; dit is de laatste, niet te omzeilen poort.
def versadoBundleMetadataProblems = { File metadataFile ->
    def problems = []
    if (!metadataFile.exists()) return ["build.json ontbreekt in de assets; draai npm run native:build en npx cap sync android"]
    def metadata = new groovy.json.JsonSlurper().parse(metadataFile)
    if (metadata.profile != "local-store-test") problems << "profiel is ${metadata.profile}, verwacht local-store-test"
    if (metadata.channel != "play-test") problems << "kanaal is ${metadata.channel}, verwacht play-test"
    if (metadata.compileProbe != false) problems << "compileproef-bundels worden nooit getekend"
    if (metadata.releaseApproved != false) problems << "releaseApproved moet false zijn"
    if (metadata.appId != "app.versado.app") problems << "appId is ${metadata.appId}"
    if (!(metadata.apiOrigin ==~ '^https://[^/\\s*@?#]+$') || metadata.apiOrigin.endsWith(".invalid")) problems << "apiOrigin is geen exacte, echte HTTPS-origin"
    if (metadata.buildNumber == null || metadata.buildNumber.toString() != versadoSetting("VERSADO_VERSION_CODE", "1")) problems << "buildNumber ${metadata.buildNumber} wijkt af van VERSADO_VERSION_CODE"
    if (metadata.version != versadoSetting("VERSADO_VERSION_NAME", "0.1.0")) problems << "version ${metadata.version} wijkt af van VERSADO_VERSION_NAME"
    return problems
}

android {
    namespace = "app.versado.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.versado.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode versadoSetting("VERSADO_VERSION_CODE", "1").toInteger()
        versionName versadoSetting("VERSADO_VERSION_NAME", "0.1.0")
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (uploadKeystorePath) {
                storeFile file(uploadKeystorePath)
                storePassword versadoSetting("VERSADO_UPLOAD_KEYSTORE_PASSWORD", "")
                keyAlias versadoSetting("VERSADO_UPLOAD_KEY_ALIAS", "")
                keyPassword versadoSetting("VERSADO_UPLOAD_KEY_PASSWORD", "")
            }
        }
    }
    buildTypes {
        release {
            // Zonder uploadsleutel blijft de release ongetekend (compileproef); met sleutel geldt de poort hierboven.
            if (uploadKeystorePath) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

tasks.configureEach { task ->
    if (uploadKeystorePath && (task.name == "bundleRelease" || task.name == "assembleRelease" || task.name == "packageRelease" || task.name == "signReleaseBundle")) {
        task.doFirst {
            def problems = versadoBundleMetadataProblems(file("src/main/assets/public/build.json"))
            if (!problems.isEmpty()) throw new GradleException("Ondertekenen geweigerd: " + problems.join("; "))
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
