name: Native platformcompilatie
on:
  pull_request:
    branches: [main, 'feat/native-*', 'fix/native-*']
    paths:
      - 'src/**'
      - 'public/**'
      - 'android/**'
      - 'ios/**'
      - 'capacitor.config.ts'
      - 'scripts/native/**'
      - 'tests/native-ios-release*'
      - 'package*.json'
      - 'tailwind.config.ts'
      - 'tsconfig.json'
      - '.github/workflows/native-platform-builds.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-platform-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
env:
  # Compileproef zonder productiebackend, accounts, signing of publicatie. Het .invalid-domein (RFC 2606) is de
  # enige origin die distributieprofielen zonder allowlist accepteren; zulke builds zijn gemarkeerd als
  # compileproef en nooit uploadbaar.
  NATIVE_API_BASE_URL: https://example.invalid
  CAPACITOR_BUILD_PROFILE: local-development
  NATIVE_APP_VERSION: 0.1.0
  NATIVE_BUILD_NUMBER: '1'
jobs:
  android-development:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK van de CI-runner
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - name: Lokaal bundelen en synchroniseren
        run: |
          npm ci
          npm run db:generate
          npm run native:build
          npx cap sync android
          node scripts/native/verify-distribution.mjs android
      - name: Echte Android-debugcompilatie
        working-directory: android
        run: bash ./gradlew :app:assembleDebug --no-daemon
      - name: Controleer de assets in de APK
        run: |
          unzip -q android/app/build/outputs/apk/debug/app-debug.apk 'assets/*' -d "$RUNNER_TEMP/versado-android-artifact"
          node scripts/native/verify-distribution.mjs android "$RUNNER_TEMP/versado-android-artifact/assets"
      - name: Releaseprofiel blijft geblokkeerd
        run: |
          if CAPACITOR_BUILD_PROFILE=release npm run native:build; then echo "release is onverwacht gebouwd"; exit 1; fi
      - name: Profiel local-internal (compileproef) bouwen, synchroniseren en verifiëren
        env:
          CAPACITOR_BUILD_PROFILE: local-internal
          NATIVE_COMPILE_PROBE: '1'
          NATIVE_DISTRIBUTION_CHANNEL: internal
        run: |
          npm run native:build
          npx cap sync android
          node scripts/native/verify-distribution.mjs android
      - name: Profiel local-store-test (play-test, compileproef) en Android App Bundle zonder signing
        # Bewijst dat de store-testketen bouwt; zonder uploadsleutel blijft de bundel ongetekend en wordt hij
        # niet bewaard of geüpload. Geen Play-upload, geen signingcredentials.
        env:
          CAPACITOR_BUILD_PROFILE: local-store-test
          NATIVE_COMPILE_PROBE: '1'
          NATIVE_DISTRIBUTION_CHANNEL: play-test
          VERSADO_VERSION_NAME: 0.1.0
          VERSADO_VERSION_CODE: '1'
        run: |
          npm run native:build
          npx cap sync android
          node scripts/native/verify-distribution.mjs android
          cd android
          bash ./gradlew :app:bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: versado-android-development-compileprobe
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            dist/native/build.json
          retention-days: 7
  ios-simulator:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Lokaal bundelen en synchroniseren
        run: |
          npm ci
          npm run db:generate
          npm run native:build
          npx cap sync ios
          node scripts/native/verify-distribution.mjs ios
      - name: Echte iOS-simulatorcompilatie zonder signing
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/versado-ios" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: iOS-poort weigert de compileproef en het archief bevat versie en privacy manifest
        # De poort moet de compileproef afkeuren, maar uitsluitend om die reden: een afwijkende versie, bundel-ID of een
        # ontbrekend privacy manifest in het echte archief zou hier als extra melding verschijnen en de stap laten falen.
        env:
          CAPACITOR_BUILD_PROFILE: local-store-test
          NATIVE_COMPILE_PROBE: '1'
          NATIVE_DISTRIBUTION_CHANNEL: testflight
        run: |
          if node scripts/native/ios-release-guard.mjs before; then echo "de poort liet een compileproef door"; exit 1; fi
          if node scripts/native/ios-release-guard.mjs after "$RUNNER_TEMP/Versado-compileprobe.xcarchive/Products/Applications/App.app" 2> "$RUNNER_TEMP/guard.txt"; then echo "de poort liet een compileproef-archief door"; exit 1; fi
          cat "$RUNNER_TEMP/guard.txt"
          grep -q "compileproef" "$RUNNER_TEMP/guard.txt"
          if grep -E "PrivacyInfo|CFBundleIdentifier|Info.plist|build.json|buildNumber|version " "$RUNNER_TEMP/guard.txt"; then echo "onverwachte archiefafwijking"; exit 1; fi
      - name: Controleer de assets in de simulatorapp
        run: |
          node scripts/native/verify-distribution.mjs ios "$RUNNER_TEMP/versado-ios/Build/Products/Debug-iphonesimulator/App.app"
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/versado-ios/Build/Products/Debug-iphonesimulator/App.app" "$RUNNER_TEMP/versado-ios-simulator.zip"
      - name: Releaseprofiel blijft geblokkeerd
        run: |
          if CAPACITOR_BUILD_PROFILE=release npm run native:build; then echo "release is onverwacht gebouwd"; exit 1; fi
      - name: Profiel local-internal (compileproef) bouwen, synchroniseren en verifiëren
        env:
          CAPACITOR_BUILD_PROFILE: local-internal
          NATIVE_COMPILE_PROBE: '1'
          NATIVE_DISTRIBUTION_CHANNEL: internal
        run: |
          npm run native:build
          npx cap sync ios
          node scripts/native/verify-distribution.mjs ios
      - name: Profiel local-store-test (testflight, compileproef), SDK-eis van Apple en archive voor echte apparaten zonder signing
        env:
          CAPACITOR_BUILD_PROFILE: local-store-test
          NATIVE_COMPILE_PROBE: '1'
          NATIVE_DISTRIBUTION_CHANNEL: testflight
        # Apple vereist voor App Store Connect-uploads Xcode 26 met de iOS 26 SDK (sinds 28 april 2026).
        # De archive wordt niet bewaard of geüpload; het bewijst alleen de apparaatarchitectuur en SDK-keten.
        run: |
          npm run native:build
          npx cap sync ios
          node scripts/native/verify-distribution.mjs ios
          xcodebuild -version
          sdk="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iphoneos SDK: $sdk"
          test "${sdk%%.*}" -ge 26
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Versado-compileprobe.xcarchive" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO archive
      - uses: actions/upload-artifact@v4
        with:
          name: versado-ios-simulator-development-compileprobe
          path: |
            ${{ runner.temp }}/versado-ios-simulator.zip
            dist/native/build.json
          retention-days: 7
