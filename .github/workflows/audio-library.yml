name: Audiobibliotheek V2
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/lib/audio/**'
      - 'src/lib/audioMirror.ts'
      - 'src/lib/scheduler.ts'
      - 'src/app/api/audio/**'
      - 'src/app/api/admin/audio/**'
      - 'src/app/api/chapters/**'
      - 'src/app/adminbackend/content/**'
      - 'src/components/ReadAloud*'
      - 'src/components/admin/AdminAudioClient.tsx'
      - 'src/components/admin/OfficialAudioClient.tsx'
      - 'prisma/**'
      - 'data/audio/**'
      - 'scripts/audio/**'
      - 'scripts/bom-audio/**'
      - 'tests/audio-*'
      - 'tests/fixtures/audio/**'
      - 'package*.json'
      - 'Dockerfile'
      - '.github/workflows/audio-library.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: audio-library-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
# De typecontrole van `next build` en `tsc` raakt op main de standaard Node-heap (OOM, gemeten op 28 oktober 2026);
# een ruimere heap voorkomt dat elke build willekeurig faalt. Alleen CI, geen productiegedrag.
env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  audio-library:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      APP_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npx prisma validate && npm run db:generate
      - run: npm run test:audio
      - name: Bron- en uitlijningsregressies
        run: |
          python3 -m venv "$RUNNER_TEMP/versado-audio-python"
          "$RUNNER_TEMP/versado-audio-python/bin/pip" install numpy
          "$RUNNER_TEMP/versado-audio-python/bin/python" tests/audio-sources.test.py
      - run: npm run build
      - run: npx tsc --noEmit && npm run lint
      - name: Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/versado-audio-browser" playwright@1.64.0
          bash scripts/ci/install-browser.sh node "$RUNNER_TEMP/versado-audio-browser/node_modules/playwright/cli.js"
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/versado-audio-browser/node_modules/playwright" >> "$GITHUB_ENV"
      - run: npm run test:audio:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audio-library-browser
          path: /tmp/versado-audio-browser
