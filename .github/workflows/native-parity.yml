name: Native bron- en functie-inventaris
on:
  pull_request:
    branches: [main, 'feat/native-*', 'fix/native-*']
    paths:
      - 'src/**'
      - 'scripts/native/parity.mjs'
      - 'scripts/native/store-readiness.mjs'
      - 'scripts/native/profiles.cjs'
      - 'scripts/native/check-test-backend.mjs'
      - 'tests/nas-test-stack.test.mjs'
      - 'deploy/test-stack/**'
      - 'scripts/native/distribution-origins.json'
      - 'tests/native-store-readiness.test.mjs'
      - 'docs/NATIVE-STORE-RELEASE-PLAN.md'
      - 'android/app/build.gradle'
      - 'capacitor.config.ts'
      - 'tests/native-parity.test.mjs'
      - 'docs/NATIVE-FEATURE-PARITY.md'
      - 'docs/native-feature-parity.inventory.json'
      - 'docs/PLATFORMEN.md'
      - 'docs/NATIVE-FOUNDATION-PHASE-1.md'
      - 'CLAUDE.md'
      - 'package*.json'
      - '.github/workflows/native-parity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:native:parity && npm run native:parity:check
      - run: npm run test:native:store-readiness && npm run native:store-readiness
      - run: npm run test:nas-stack
      - run: npx eslint scripts/native/parity.mjs tests/native-parity.test.mjs scripts/native/store-readiness.mjs tests/native-store-readiness.test.mjs scripts/native/verify-distribution.mjs scripts/native/check-test-backend.mjs tests/nas-test-stack.test.mjs
