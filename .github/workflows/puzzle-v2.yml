name: Legpuzzel V2 integratie en browser

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/lib/puzzle/**'
      - 'src/lib/shop.ts'
      - 'src/lib/data/**'
      - 'src/lib/chapterGuess.ts'
      - 'src/lib/scrabbleGame.ts'
      - 'src/components/ChapterGuessSoloClient.tsx'
      - 'src/components/ScrabbleBoardClient.tsx'
      - 'src/lib/jigsaw*'
      - 'src/lib/streak.ts'
      - 'src/components/JigsawV2Client.tsx'
      - 'src/components/PuzzleHintPanel.tsx'
      - 'src/lib/kompas/**'
      - 'src/lib/i18n/messages/**'
      - 'src/components/SubpageBackBar.tsx'
      - 'src/lib/backTarget.ts'
      - 'src/app/globals.css'
      - 'src/app/api/jigsaw-v2/**'
      - 'src/app/api/puzzle/**'
      - 'src/server/puzzle.ts'
      - 'src/components/puzzle/**'
      - 'src/app/jigsaw/**'
      - 'src/lib/friendProfiles.ts'
      - 'src/components/FriendProfileClient.tsx'
      - 'src/components/profile/**'
      - 'src/components/ProfileClient.tsx'
      - 'src/app/api/account/**'
      - 'src/app/api/profile/**'
      - 'prisma/**'
      - 'tests/puzzle*'
      - 'tests/jigsaw*'
      - 'scripts/puzzle/**'
      - 'package*.json'
      - '.github/workflows/puzzle-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

# Actuele main heeft voor volledige TypeScript-controle meer dan 2 GiB heap nodig.
# Geen typechecks overslaan; begrens alleen de build-/testprocessen op 4 GiB.
env:
  NODE_OPTIONS: --max-old-space-size=4096
jobs:
  puzzle-v2:
    runs-on: ubuntu-latest
    # Een gewone run duurt 11-13 minuten; alleen "Browser klaarzetten" (playwright install --with-deps) schommelt van seconden tot
    # bijna 10 minuten. Met 20 minuten brak een verder geslaagde run daardoor soms af tijdens de laatste regressiestap.
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Dezelfde geïsoleerde runner als lokaal: maakt en verwijdert zijn eigen
      # Postgres-container en past alle migraties toe. Geen externe DB-secrets.
      - name: Prisma en productiebuild
        run: |
          npx prisma validate
          npm run db:generate
          npm run build
      - name: Browser klaarzetten
        run: |
          npm install --prefix "$RUNNER_TEMP/versado-browser" playwright@1.64.0
          bash scripts/ci/install-browser.sh node "$RUNNER_TEMP/versado-browser/node_modules/playwright/cli.js"
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/versado-browser/node_modules/playwright" >> "$GITHUB_ENV"
      - name: Sessies, vraag, reeks, content en echte productie-browserflow
        env:
          NODE_ENV: production
        run: npm run test:puzzle:integration -- --browser --multiplayer
      - name: Engine, spelregels, vertalingen en legacy-regressies
        run: |
          npm run test:puzzle
          npm run test:live-data
          npm run test:focus
          npx tsx --test tests/kompas.test.ts tests/kompas-layout-integration.test.ts
          npx tsx scripts/i18n/check.ts
          npm run lint
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Browserscreenshots bewaren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: puzzle-v2-browser
          path: |
            /tmp/versado-puzzle-browser
            /tmp/mp-*.png
          if-no-files-found: warn
          retention-days: 7
