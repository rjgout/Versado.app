name: Native Foundation
on:
  pull_request:
    branches: [main, develop, 'feat/native-*', 'fix/native-*']
    paths:
      - 'src/lib/native/**'
      - 'src/lib/data/**'
      - 'src/lib/today*'
      - 'src/lib/listPreferences.server.ts'
      - 'src/lib/social/friendRequests.ts'
      - 'src/app/api/list-order/**'
      - 'src/app/api/friends/**'
      - 'src/lib/artwork.ts'
      - 'src/lib/learning/streakReturnRules.ts'
      - 'src/lib/hymns/sunday.ts'
      - 'src/lib/generalConference.ts'
      - 'src/lib/studyContent/presentation.ts'
      - 'src/lib/studyContent/mediaAccess.ts'
      - 'src/lib/studyContent/storage.ts'
      - 'tests/native-study-media*'
      - 'tests/fixtures/native-study-media.ts'
      - 'src/components/versado/MediaArtwork.tsx'
      - 'src/components/versado/VisualIdentityIcon.tsx'
      - 'src/components/versado/CardMenu.tsx'
      - 'src/components/today/**'
      - 'src/components/kompas/KompasEntryCard*'
      - 'src/components/study/Program*'
      - 'src/components/study/CfmTodayCard.tsx'
      - 'src/app/dashboard/**'
      - 'src/lib/contentPickerContract.ts'
      - 'src/lib/contentCollections.ts'
      - 'src/lib/contentSwitch.ts'
      - 'src/components/ContentSwitcher.tsx'
      - 'src/components/content/**'
      - 'src/components/versado/ContentIcon.tsx'
      - 'src/lib/liveQuiz.ts'
      - 'src/lib/chapterGuess.ts'
      - 'src/components/GameRoom.tsx'
      - 'src/components/ChapterGuessGameRoom.tsx'
      - 'src/server/gameServer.ts'
      - 'src/lib/realtime.ts'
      - 'src/lib/account/**'
      - 'src/components/account/**'
      - 'src/components/profile/**'
      - 'src/components/ResetPasswordClient.tsx'
      - 'src/components/ChangePasswordClient.tsx'
      - 'src/components/TwoFactorSettings.tsx'
      - 'src/app/api/account/**'
      - 'src/components/native/**'
      - 'src/components/navigation/**'
      - 'src/components/legal/**'
      - 'src/components/shell/**'
      - 'src/components/BottomNav.tsx'
      - 'src/app/layout.tsx'
      - 'src/app/privacy/**'
      - 'src/app/cookies/**'
      - 'src/app/api/v1/**'
      - 'src/lib/auth.ts'
      - 'src/lib/registration.ts'
      - 'src/app/api/auth/**'
      - 'src/app/verify-email/**'
      - 'src/lib/platform.ts'
      - 'capacitor.config.ts'
      - 'ios/**'
      - 'android/**'
      - 'prisma/**'
      - 'package*.json'
      - 'scripts/native/**'
      - 'tests/native-access*'
      - 'tests/fixtures/native-access*'
      - 'tests/native-foundation*'
      - 'tests/native-navigation*'
      - 'tests/native-shell*'
      - 'tests/native-content*'
      - 'tests/native-today*'
      - 'tests/hymns-sunday.test.ts'
      - 'tests/artwork.test.ts'
      - 'tests/streak-return.test.ts'
      - 'tests/generalConference.test.ts'
      - 'tests/native-data*'
      - 'tests/native-route-focus*'
      - 'tests/native-responsive-css*'
      - 'tailwind.config.ts'
      - 'tests/native-account*'
      - 'tests/native-socket*'
      - 'tests/native-distribution*'
      - 'tests/fixtures/native-socket*'
      - 'tests/fixtures/native-foundation*'
      - '.github/workflows/native-foundation.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-foundation-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
# De typecontrole van `next build` en `tsc` raakt op main de standaard Node-heap (OOM, gemeten op 28 oktober 2026);
# een ruimere heap voorkomt dat elke build willekeurig faalt. Alleen CI, geen productiegedrag.
env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  native-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Contracten, types, lint en webbuild
        run: |
          npx prisma validate
          npm run db:generate
          npm run test:native
          npm run test:focus
          npm run test:profile
          npx tsx --test tests/hymns-sunday.test.ts tests/artwork.test.ts tests/streak-return.test.ts tests/generalConference.test.ts
          npm run test:native:parity
          npm run native:parity:check
          npm run lint
          npx tsx scripts/i18n/check.ts
          npm run build
          npx tsc --noEmit
      - name: Lokale bundle en Capacitor-sync (geen apparaatbuild)
        run: |
          NATIVE_API_BASE_URL=https://versado.app npm run native:build
          CAPACITOR_BUILD_PROFILE=local-development npx cap sync
      - name: Browser klaarzetten
        run: |
          npm install --prefix "$RUNNER_TEMP/versado-browser" playwright@1.64.0
          bash scripts/ci/install-browser.sh node "$RUNNER_TEMP/versado-browser/node_modules/playwright/cli.js"
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/versado-browser/node_modules/playwright" >> "$GITHUB_ENV"
      - name: Routefocus, selectie en mobiele CSS (320/375/390/400px, 100/200%, licht/donker)
        run: npm run test:native:focus
      - name: Migratie, sessies, Apple en lokale leesflow op geïsoleerde PostgreSQL
        run: npm run test:native:integration
      - name: Browserbewijs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-foundation-browser
          path: /tmp/versado-native-browser
          retention-days: 7
      - name: Focusbewijs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-route-focus-browser
          path: /tmp/versado-focus-browser
          retention-days: 7
