name: iOS TestFlight-archief (handmatig, beschermd)
# WP2: archiveert en exporteert een ondertekende IPA voor TestFlight. Alleen handmatig te starten vanaf main, in de
# beschermde GitHub-omgeving "ios-testflight" (de eigenaar stelt vereiste goedkeurders en de secrets in).
# Deze workflow uploadt NIETS naar App Store Connect: export gebruikt destination "export" en de eigenaar plaatst de IPA zelf.
# Compileproef-bundels (compileProbe:true) worden nooit gearchiveerd voor distributie; publieke release blijft geblokkeerd.
on:
  workflow_dispatch:
    inputs:
      app_version:
        description: 'Versienaam (x.y.z)'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: native-ios-release
  cancel-in-progress: false
jobs:
  testflight-archive:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-latest
    timeout-minutes: 60
    environment: ios-testflight
    env:
      CAPACITOR_BUILD_PROFILE: local-store-test
      NATIVE_DISTRIBUTION_CHANNEL: testflight
      NATIVE_APP_VERSION: ${{ inputs.app_version }}
      NATIVE_BUILD_NUMBER: ${{ github.run_number }}
      # Niet-geheime omgevingsvariabele: de HTTPS-origin van de testbackend; moet in scripts/native/distribution-origins.json staan.
      NATIVE_API_BASE_URL: ${{ vars.NATIVE_STORE_TEST_API_ORIGIN }}
    steps:
      - name: Versienaam valideren vóór alles (invoer nooit in shelltekst interpoleren)
        env:
          APP_VERSION: ${{ inputs.app_version }}
        run: |
          if ! [[ "$APP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "::error::app_version moet x.y.z zijn"; exit 1; fi
      - uses: actions/checkout@v7
      - name: Controleer de eigenaarsvoorwaarden (geen waarden in de log)
        env:
          HAS_TEAM: ${{ secrets.APPLE_TEAM_ID != '' }}
          HAS_KEY_ID: ${{ secrets.ASC_KEY_ID != '' }}
          HAS_ISSUER: ${{ secrets.ASC_ISSUER_ID != '' }}
          HAS_KEY: ${{ secrets.ASC_KEY_P8 != '' }}
          HAS_ORIGIN: ${{ vars.NATIVE_STORE_TEST_API_ORIGIN != '' }}
        run: |
          missing=""
          [ "$HAS_TEAM" = "true" ] || missing="$missing APPLE_TEAM_ID"
          [ "$HAS_KEY_ID" = "true" ] || missing="$missing ASC_KEY_ID"
          [ "$HAS_ISSUER" = "true" ] || missing="$missing ASC_ISSUER_ID"
          [ "$HAS_KEY" = "true" ] || missing="$missing ASC_KEY_P8"
          [ "$HAS_ORIGIN" = "true" ] || missing="$missing vars.NATIVE_STORE_TEST_API_ORIGIN"
          if [ -n "$missing" ]; then echo "::error::Eigenaartaak: ontbrekende secrets/variabelen in omgeving ios-testflight:$missing"; exit 1; fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Xcode vastzetten en SDK-eis van Apple controleren
        # IOS_XCODE_APP (repository- of omgevingsvariabele, bijvoorbeeld /Applications/Xcode_26.0.app) zet een exacte Xcode vast;
        # zonder die variabele geldt de standaard van de runner en staat de gebruikte versie in de samenvatting.
        env:
          IOS_XCODE_APP: ${{ vars.IOS_XCODE_APP }}
        run: |
          if [ -n "$IOS_XCODE_APP" ]; then sudo xcode-select -s "$IOS_XCODE_APP/Contents/Developer"; fi
          xcodebuild -version
          sdk="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iphoneos SDK: $sdk"
          test "${sdk%%.*}" -ge 26
      - name: Lokale bundel, synchronisatie en verificatie (weigert zonder allowlist-origin)
        run: |
          npm ci
          npm run db:generate
          npm run native:build
          npx cap sync ios
          node scripts/native/verify-distribution.mjs ios
          node scripts/native/ios-release-guard.mjs before
      - name: Archiveren en exporteren (ondertekening via App Store Connect API-sleutel, geen upload)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          umask 077
          key="$RUNNER_TEMP/AuthKey.p8"
          trap 'rm -f "$key" "$RUNNER_TEMP/ExportOptions.plist"' EXIT
          printf '%s' "$ASC_KEY_P8" | base64 -d > "$key"
          auth=(-allowProvisioningUpdates -authenticationKeyPath "$key" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          archive="$RUNNER_TEMP/Versado.xcarchive"
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$archive" MARKETING_VERSION="$NATIVE_APP_VERSION" CURRENT_PROJECT_VERSION="$NATIVE_BUILD_NUMBER" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic "${auth[@]}" archive
          node scripts/native/ios-release-guard.mjs after "$archive/Products/Applications/App.app"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$archive" -exportPath "$RUNNER_TEMP/export" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" "${auth[@]}"
          mkdir -p ios-export && cp "$RUNNER_TEMP"/export/*.ipa ios-export/
      - name: Samenvatting
        run: |
          ipa="$(ls ios-export/*.ipa)"
          sha="$(shasum -a 256 "$ipa" | cut -d' ' -f1)"
          {
            echo "### iOS TestFlight-archief"
            echo "- versie $NATIVE_APP_VERSION (build $NATIVE_BUILD_NUMBER)"
            echo "- commit $GITHUB_SHA"
            echo "- $(xcodebuild -version | tr '\n' ' ')"
            echo "- sha256 \`$sha\`"
            echo "- Niet geüpload. De eigenaar plaatst de IPA handmatig in TestFlight (bijvoorbeeld met Transporter)."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: versado-ios-testflight-${{ github.run_number }}
          path: |
            ios-export/*.ipa
            dist/native/build.json
          retention-days: 7
