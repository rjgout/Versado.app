name: Scripture publication
on:
  pull_request:
    branches: [develop, main]
    paths:
      - 'src/lib/scripturePublication.ts'
      - 'src/lib/contentAccess.ts'
      - 'src/lib/contentCollections.ts'
      - 'src/lib/contentImportLock.ts'
      - 'src/lib/realtime.ts'
      - 'src/app/api/admin/content-switcher/**'
      - 'src/components/admin/AdminScripturePublicationClient.tsx'
      - 'src/components/AdminContentSwitcherClient.tsx'
      - 'src/components/ConfirmProvider.tsx'
      - 'src/lib/i18n/messages/*.ts'
      - 'scripts/content-architecture/test-access-isolated.mjs'
      - 'scripts/otb/**'
      - 'tests/scripture-publication*'
      - 'prisma/schema.prisma'
      - 'prisma/migrations/**'
      - '.github/workflows/scripture-publication.yml'
permissions:
  contents: read
concurrency:
  group: scripture-publication-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  publication:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      NEXT_TELEMETRY_DISABLED: '1'
      DATABASE_URL: postgresql://validation:validation@127.0.0.1:1/validation
      OTB_PUBLICATION_TEST_SOURCE: /tmp/versado-otb-publication-source
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma validate && npm run db:generate && npx tsc --noEmit
      - name: Gepinde publieke testbron en bewijs controleren; geen live import
        run: |
          node scripts/otb/prepare-publication-test-source.mjs
          node --import tsx scripts/otb/build-publication-evidence.mjs "$OTB_PUBLICATION_TEST_SOURCE"
          git diff --exit-code -- scripts/otb/publication-evidence.json
      - run: npm run build
      - name: Browser klaarzetten
        run: |
          npm install --prefix "$RUNNER_TEMP/versado-browser" playwright@1.64.0
          bash scripts/ci/install-browser.sh node "$RUNNER_TEMP/versado-browser/node_modules/playwright/cli.js"
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/versado-browser/node_modules/playwright" >> "$GITHUB_ENV"
      - name: Publicatie, rechten, behoud, web/nativecatalogus en mobiel beheer op wegwerpdatabase
        run: node scripts/content-architecture/test-access-isolated.mjs --focused --scripture-publication --browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scripture-publication-browser
          path: /tmp/versado-scripture-publication-browser
          if-no-files-found: warn
