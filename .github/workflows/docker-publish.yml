name: Build and publish Docker image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Handmatige reviewcheck: registry-login/publicatie blijven uitsluitend push.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # jehova-proxy en jehova-deploy-agent horen bij de maintenance-mode
          # deployopzet (zie docs/DEPLOY-SYNOLOGY.md) — samen met jehova-app
          # als vooraf gebouwde images op ghcr.io, zodat Portainer's
          # Web-editor-stacks (die geen buildcontext hebben) ze net als
          # jehova-app zelf gewoon kunnen pullen.
          - name: jehova-app
            context: .
            dockerfile: ./Dockerfile
          # De proxy heeft de rootcontext nodig voor de mascotte-asset. De
          # Dockerfile moet daarom expliciet zijn; anders bouwt deze matrixrij
          # per ongeluk opnieuw de app-image uit de root-Dockerfile.
          - name: jehova-proxy
            context: .
            dockerfile: ./deploy/nginx/Dockerfile
          - name: jehova-deploy-agent
            context: ./deploy/agent
            dockerfile: ./deploy/agent/Dockerfile
          # Aparte onderhoudsimage (target `maintenance` van de root-Dockerfile): dezelfde runtime als jehova-app plus de
          # cursusonderhoudsscripts, zie docs/DEPLOY-SYNOLOGY.md ("Cursusonderhoud"). Start niets zelf.
          - name: jehova-maintenance
            context: .
            dockerfile: ./Dockerfile
            target: maintenance
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bepaal image-naam (ghcr.io vereist kleine letters)
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            NEXT_PUBLIC_BUILD_SHA=${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # Bouwt de onderhoudsimage lokaal (nooit gepubliceerd door deze job) en bewijst dat de cursusscripts er echt in zitten en werken:
  # aanwezig, geen migraties bij het starten, duidelijke fout zonder DATABASE_URL, --apply weigert zonder bevestiging, en audit en
  # dry-run werken met dezelfde Prisma-client tegen een wegwerp-PostgreSQL zonder gegevens te wijzigen.
  maintenance-image:
    name: maintenance-image
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: maintenance_ci
          POSTGRES_PASSWORD: maintenance_ci_wachtwoord
          POSTGRES_DB: maintenance_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U maintenance_ci -d maintenance_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build onderhoudsimage (alleen laden, niet publiceren)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: maintenance
          load: true
          push: false
          tags: jehova-maintenance:ci
          build-args: |
            NEXT_PUBLIC_BUILD_SHA=${{ github.sha }}
          cache-from: |
            type=gha,scope=jehova-maintenance
            type=gha,scope=jehova-app
          cache-to: type=gha,mode=max,scope=jehova-maintenance

      - name: Controleer de onderhoudsimage
        run: scripts/ci/check-maintenance-image.sh jehova-maintenance:ci "postgresql://maintenance_ci:maintenance_ci_wachtwoord@127.0.0.1:5432/maintenance_ci"
