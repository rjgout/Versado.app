name: Build and publish Docker image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # jehova-proxy en jehova-deploy-agent horen bij de maintenance-mode
          # deployopzet (zie docs/DEPLOY-SYNOLOGY.md) — samen met jehova-app
          # als vooraf gebouwde images op ghcr.io, zodat Portainer's
          # Web-editor-stacks (die geen buildcontext hebben) ze net als
          # jehova-app zelf gewoon kunnen pullen.
          - name: jehova-app
            context: .
            dockerfile: ./Dockerfile
          # De proxy heeft de rootcontext nodig voor de mascotte-asset. De
          # Dockerfile moet daarom expliciet zijn; anders bouwt deze matrixrij
          # per ongeluk opnieuw de app-image uit de root-Dockerfile.
          - name: jehova-proxy
            context: .
            dockerfile: ./deploy/nginx/Dockerfile
          - name: jehova-deploy-agent
            context: ./deploy/agent
            dockerfile: ./deploy/agent/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bepaal image-naam (ghcr.io vereist kleine letters)
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            NEXT_PUBLIC_BUILD_SHA=${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
