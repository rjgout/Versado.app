name: Schriftillustraties typecontrole

on:
  pull_request:
    branches: [main]
    paths:
      - 'public/kids/images/**'
      - 'public/scripture/**'
      - 'docs/scripture/**'
      - '.github/workflows/scripture-artwork.yml'
  workflow_dispatch:

permissions:
  contents: read

# De typecontrole van `next build` en `tsc` raakt op main de standaard Node-heap (OOM, gemeten op 28 oktober 2026);
# een ruimere heap voorkomt dat elke build willekeurig faalt. Alleen CI, geen productiegedrag.
env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx next typegen
      - run: npx tsc --noEmit
