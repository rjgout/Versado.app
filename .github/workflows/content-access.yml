name: Contentarchitectuur 1A–2D toegang, context, selectie en spellen

on:
  pull_request:
    branches: [main]
    paths:
      - 'prisma/schema.prisma'
      - 'prisma/migrations/**'
      - 'src/lib/mysteries/**'
      - 'src/components/mysteries/**'
      - 'src/app/mysteries/**'
      - 'src/app/api/mysteries/**'
      - 'tests/mystery*'
      - 'tests/fixtures/mystery*'
      - 'tests/learning-progress.integration.test.ts'
      - 'src/lib/references/**'
      - 'src/components/study/Reference*'
      - 'src/app/api/study-references/**'
      - 'src/app/scripture/**'
      - 'tests/reference-*'
      - 'tests/content-selection-version-migration.mjs'
      - 'tests/fixtures/reference-content.mjs'
      - 'src/lib/studyContent/**'
      - 'src/lib/scrollRestore.ts'
      - 'src/components/shell/NavigationScroll.tsx'
      - 'src/components/study/ReadingPositionController.ts'
      - 'src/components/study/RichContentBlocks.tsx'
      - 'src/components/study/StudyReader.tsx'
      - 'src/app/study-lesson/**'
      - 'src/app/api/reading-position/**'
      - 'src/app/api/study-read/**'
      - 'tests/reading-position*'
      - 'tests/study-reader*'
      - 'tests/study-read*'
      - 'src/app/api/admin/study-publications/**'
      - 'src/app/api/admin/study-media/**'
      - 'src/app/api/study-media/**'
      - 'src/components/admin/StudyRevisionContent.tsx'
      - 'src/components/admin/AdminStudyPublicationsClient.tsx'
      - 'src/components/ConfirmProvider.tsx'
      - 'tests/study-content*'
      - 'tests/study-publication*'
      - 'scripts/study-content/**'
      - 'tests/study-identity-migration.mjs'
      - 'tests/fixtures/study-content.ts'
      - 'src/lib/contentAccess.ts'
      - 'src/lib/snelleZendeling/**'
      - 'src/server/quickMissionary.ts'
      - 'src/app/snelle-zendeling/**'
      - 'src/app/live/**'
      - 'src/lib/activeGames.ts'
      - 'src/lib/gameSettings.ts'
      - 'src/components/snelleZendeling/**'
      - 'tests/quick-missionary-source*'
      - 'tests/snelle-zendeling*'
      - 'tests/genees-economy*'
      - 'tests/fixtures/quick-missionary.ts'
      - 'src/lib/gameAvailability*.ts'
      - 'src/lib/gameStartGuard.ts'
      - 'src/lib/study/startAvailability.ts'
      - 'src/app/api/study/create/**'
      - 'src/lib/adminContentInspection.ts'
      - 'src/components/admin/AdminContentInspectionClient.tsx'
      - 'src/app/adminbackend/content/**'
      - 'src/app/api/admin/content-inspection/**'
      - 'src/app/api/admin/game-scopes/**'
      - 'tests/game-availability*.test.ts'
      - 'src/lib/contentCollections.ts'
      - 'src/lib/contentPickerContract.ts'
      - 'src/lib/contentSwitch.ts'
      - 'src/lib/contentRouting.ts'
      - 'tests/content-picker*'
      - 'src/lib/studyContext*.ts'
      - 'src/lib/data/studyContext.ts'
      - 'src/lib/data/scopes.ts'
      - 'src/app/api/study-context/**'
      - 'src/app/api/content-context/**'
      - 'tests/study-context*'
      - 'docs/DATA-REFRESH.md'
      - 'src/app/api/chapters/**'
      - 'src/app/api/verses/**'
      - 'src/app/api/reading*/**'
      - 'src/app/api/bookmarks/**'
      - 'src/app/api/exercises/**'
      - 'src/app/api/practice/**'
      - 'src/app/api/live/create*/**'
      - 'src/app/api/word-game/**'
      - 'src/app/api/word-search/**'
      - 'src/app/api/jigsaw*/**'
      - 'src/app/api/scrabble/**'
      - 'src/app/api/challenges/**'
      - 'src/app/api/alleskenner/**'
      - 'src/app/api/snelle-zendeling/**'
      - 'src/app/api/dictionary/**'
      - 'src/app/api/persons/**'
      - 'src/app/lesson/**'
      - 'src/app/reading-lesson/**'
      - 'src/app/courses/**'
      - 'src/app/adminbackend/content-preview/**'
      - 'tests/content-work*'
      - 'tests/fixtures/content-1a-catalog.json'
      - 'tests/content-access*'
      - 'tests/content-inventory*'
      - 'scripts/content-architecture/**'
      - 'package*.json'
      - '.github/workflows/content-access.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: content-access-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  content-access:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://validation:validation@127.0.0.1:1/validation
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Prisma, types en schone productiebuild
        run: |
          npx prisma validate
          npm run db:generate
          npx tsc --noEmit
          rm -rf .next
          npm run build
      - name: Echte HTTP-toegang, studiecontext en migratiebehoud op eigen PostgreSQL
        run: npm run test:study-content:integration
      - name: Regressie, lint en vertalingen
        run: |
          npx tsx --test tests/admin-layout.test.ts tests/content-edition.test.ts tests/content-switch.test.ts tests/learning-rules.test.ts tests/streak-central.test.ts
          npm run test:focus
          npm run test:live-data
          npm run lint
          npx tsx scripts/i18n/check.ts

  quick-missionary-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://validation:validation@127.0.0.1:1/validation
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Prisma, types en productiebuild
        run: |
          npx prisma validate
          npm run db:generate
          npx tsc --noEmit
          npm run build
      - name: Browser klaarzetten
        run: |
          npm install --prefix "$RUNNER_TEMP/versado-browser" playwright@1.64.0
          node "$RUNNER_TEMP/versado-browser/node_modules/playwright/cli.js" install --with-deps chromium
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/versado-browser/node_modules/playwright" >> "$GITHUB_ENV"
      - name: Migratiebehoud, Genees-economie en twee productie-instances op eigen PostgreSQL/Redis
        run: npm run test:snelle-zendeling:integration
      - name: Browserbewijs bewaren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quick-missionary-source-browser
          path: /tmp/versado-qm-source-browser
          if-no-files-found: ignore

  mystery-persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://validation:validation@127.0.0.1:1/validation
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Prisma, types en productiebuild
        run: |
          npx prisma validate
          npm run db:generate
          npx tsc --noEmit
          npm run build
      - name: Browser klaarzetten
        run: |
          npm install --prefix "$RUNNER_TEMP/versado-browser" playwright@1.64.0
          node "$RUNNER_TEMP/versado-browser/node_modules/playwright/cli.js" install --with-deps chromium
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/versado-browser/node_modules/playwright" >> "$GITHUB_ENV"
      - name: Migratiebehoud, Mysterie-opslag, hints en browserflows op eigen PostgreSQL
        run: |
          npm run test:mystery
          npm run test:mystery:integration
      - name: Browserbewijs bewaren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mystery-persistence-browser
          path: /tmp/versado-mystery-browser
          if-no-files-found: ignore

  study-import-publication:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://validation:validation@127.0.0.1:1/validation
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Prisma, types, unit en schone productiebuild
        run: |
          npx prisma validate
          npm run db:generate
          npx tsc --noEmit
          npm run test:study-publication
          npm run build
      - name: Browser klaarzetten
        run: |
          npm install --prefix "$RUNNER_TEMP/versado-browser" playwright@1.64.0
          node "$RUNNER_TEMP/versado-browser/node_modules/playwright/cli.js" install --with-deps chromium
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/versado-browser/node_modules/playwright" >> "$GITHUB_ENV"
      - name: Geïsoleerde import/publicatie, foutinjectie, databehoud en echte containervervanging
        run: npm run test:study-publication:integration
      - name: Browserbewijs bewaren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: study-import-publication-browser
          path: /tmp/versado-study-publication-browser
          if-no-files-found: ignore

  study-reader:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DATABASE_URL: postgresql://validation:validation@127.0.0.1:1/validation
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Prisma, types, leescontract en schone productiebuild
        run: |
          npx prisma validate
          npm run db:generate
          npx tsc --noEmit
          npm run test:study-reader
          npm run build
      - name: Browser klaarzetten
        run: |
          npm install --prefix "$RUNNER_TEMP/versado-browser" playwright@1.64.0
          node "$RUNNER_TEMP/versado-browser/node_modules/playwright/cli.js" install --with-deps chromium
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/versado-browser/node_modules/playwright" >> "$GITHUB_ENV"
      - name: Geïsoleerde migratie, privacy, conflicten, reader, hervatten en expliciet gelezen
        run: |
          npm run test:study-reader:integration
          npm run test:study-read:integration
      - name: Browserbewijs bewaren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: study-reader-browser
          path: |
            /tmp/versado-study-reader-browser
            /tmp/versado-study-read-browser
          if-no-files-found: ignore

  reference-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://validation:validation@127.0.0.1:1/validation
      NEXT_TELEMETRY_DISABLED: '1'
      SESSION_SECRET: reference-preview-ci-build-only-secret
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Schema, types, resolverbewijs en schone productiebuild
        run: |
          npx prisma validate
          npm run db:generate
          npx tsc --noEmit
          npm run test:references
          npm run build
      - name: Browser klaarzetten
        run: |
          npm install --prefix "$RUNNER_TEMP/versado-browser" playwright@1.64.0
          node "$RUNNER_TEMP/versado-browser/node_modules/playwright/cli.js" install --with-deps chromium
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/versado-browser/node_modules/playwright" >> "$GITHUB_ENV"
      - name: Eigen PostgreSQL, migratiebehoud, versieconflicten en echte browserflows
        run: npm run test:references:integration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reference-preview-browser
          path: /tmp/versado-reference-preview-browser
          if-no-files-found: ignore
