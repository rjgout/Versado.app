      - name: Browser klaarzetten
        run: |
          npm install --prefix "$RUNNER_TEMP/versado-browser" playwright@1.64.0
          bash scripts/ci/install-browser.sh node "$RUNNER_TEMP/versado-browser/node_modules/playwright/cli.js"
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/versado-browser/node_modules/playwright" >> "$GITHUB_ENV"
      - name: Eigen PostgreSQL, migratiebehoud, versieconflicten en echte browserflows
        run: npm run test:references:integration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reference-preview-browser
          path: /tmp/versado-reference-preview-browser
          if-no-files-found: ignore

  cfm-2026-import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://validation:validation@127.0.0.1:1/validation
      SESSION_SECRET: cfm-ci-build-only-secret
      NEXT_TELEMETRY_DISABLED: '1'
      CFM_TEST_ASSETS: /tmp/versado-cfm-test-assets
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Schema, types, alle 52 bronnen en productiebuild
        run: |
          npx prisma validate
          npm run db:generate
          npx tsc --noEmit
          npm run test:cfm-2026
          npm run build
      - name: Gepinde publieke OTB- en mediabestanden voorbereiden
        run: node scripts/study-content/prepare-cfm-test-assets.mjs
      - name: Browser klaarzetten
        run: |
          npm install --prefix "$RUNNER_TEMP/versado-browser" playwright@1.64.0
          bash scripts/ci/install-browser.sh node "$RUNNER_TEMP/versado-browser/node_modules/playwright/cli.js"
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/versado-browser/node_modules/playwright" >> "$GITHUB_ENV"
