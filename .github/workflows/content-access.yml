permissions:
  contents: read

concurrency:
  group: content-access-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  content-access:
    runs-on: ubuntu-latest
    # Een gewone run duurt 12-13 minuten; alleen "Annotatiebrowser klaarzetten" (playwright install --with-deps) schommelt van enkele
    # seconden tot bijna 10 minuten. Met 20 minuten brak een verder geslaagde run daardoor soms af tijdens de regressiestap.
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://validation:validation@127.0.0.1:1/validation
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Prisma, types en schone productiebuild
        run: |
          npx prisma validate
          npm run db:generate
          npx tsc --noEmit
          rm -rf .next
          npm run build
      - name: Annotatiebrowser klaarzetten
        run: |
          npm install --prefix "$RUNNER_TEMP/versado-browser" --no-save --no-package-lock playwright
          bash scripts/ci/install-browser.sh "$RUNNER_TEMP/versado-browser/node_modules/.bin/playwright"
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/versado-browser/node_modules/playwright" >> "$GITHUB_ENV"
      - name: Echte HTTP-toegang, studiecontext en migratiebehoud op eigen PostgreSQL
        run: |
          npm run test:study-content:integration
          npm run test:annotations:integration -- --browser
      - name: Regressie, lint en vertalingen
        run: |
          npx tsx --test tests/admin-layout.test.ts tests/cfm-2026-manifest.test.ts tests/content-edition.test.ts tests/content-switch.test.ts tests/learning-rules.test.ts tests/proxy-headers.test.ts tests/reading-path.test.ts tests/reading-courses.test.ts tests/course-scripts.test.ts tests/streak-central.test.ts
          npm run test:annotations
          npm run test:focus
          npm run test:dorp
          npm run test:dorp:integration -- --browser --regressions
          npm run test:live-data
          npm run lint
          npx tsx scripts/i18n/check.ts

      - name: Dorp-browserbewijs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: versado-dorp-browser
          path: /tmp/versado-dorp-browser
          if-no-files-found: ignore

      - name: Annotatiebrowserbewijs bewaren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: annotation-actions-browser
          path: |
            /tmp/versado-annotation-actions-browser
            /tmp/versado-reader-verse-menu-browser
            /tmp/versado-study-folder-browser
            /tmp/versado-annotation-recovery-browser
          if-no-files-found: warn
          retention-days: 7

  quick-missionary-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://validation:validation@127.0.0.1:1/validation
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Prisma, types en productiebuild
        run: |
          npx prisma validate
          npm run db:generate
          npx tsc --noEmit
          npm run build
      - name: Browser klaarzetten
        run: |
          npm install --prefix "$RUNNER_TEMP/versado-browser" playwright@1.64.0
          bash scripts/ci/install-browser.sh node "$RUNNER_TEMP/versado-browser/node_modules/playwright/cli.js"
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/versado-browser/node_modules/playwright" >> "$GITHUB_ENV"
      - name: Migratiebehoud, Genees-economie en twee productie-instances op eigen PostgreSQL/Redis
        run: npm run test:snelle-zendeling:integration
      - name: Browserbewijs bewaren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quick-missionary-source-browser
          path: /tmp/versado-qm-source-browser
          if-no-files-found: ignore

  mystery-persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://validation:validation@127.0.0.1:1/validation
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Prisma, types en productiebuild
        run: |
          npx prisma validate
          npm run db:generate
          npx tsc --noEmit
          npm run build
      - name: Browser klaarzetten
        run: |
          npm install --prefix "$RUNNER_TEMP/versado-browser" playwright@1.64.0
          bash scripts/ci/install-browser.sh node "$RUNNER_TEMP/versado-browser/node_modules/playwright/cli.js"
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/versado-browser/node_modules/playwright" >> "$GITHUB_ENV"
      - name: Migratiebehoud, Mysterie-opslag, hints en browserflows op eigen PostgreSQL
        run: |
          npm run test:mystery
          npm run test:mystery:integration
      - name: Browserbewijs bewaren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mystery-persistence-browser
          path: /tmp/versado-mystery-browser
          if-no-files-found: ignore

  study-import-publication:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://validation:validation@127.0.0.1:1/validation
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Prisma, types, unit en schone productiebuild
        run: |
          npx prisma validate
          npm run db:generate
          npx tsc --noEmit
          npm run test:study-publication
          npm run build
      - name: Browser klaarzetten
        run: |
          npm install --prefix "$RUNNER_TEMP/versado-browser" playwright@1.64.0
          bash scripts/ci/install-browser.sh node "$RUNNER_TEMP/versado-browser/node_modules/playwright/cli.js"
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/versado-browser/node_modules/playwright" >> "$GITHUB_ENV"
      - name: Geïsoleerde import/publicatie, foutinjectie, databehoud en echte containervervanging
        run: npm run test:study-publication:integration
      - name: Browserbewijs bewaren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: study-import-publication-browser
          path: /tmp/versado-study-publication-browser
          if-no-files-found: ignore

  study-reader:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DATABASE_URL: postgresql://validation:validation@127.0.0.1:1/validation
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Prisma, types, leescontract en schone productiebuild
        run: |
          npx prisma validate
          npm run db:generate
          npx tsc --noEmit
          npm run test:study-reader
          npm run build
      - name: Browser klaarzetten
        run: |
          npm install --prefix "$RUNNER_TEMP/versado-browser" playwright@1.64.0
          bash scripts/ci/install-browser.sh node "$RUNNER_TEMP/versado-browser/node_modules/playwright/cli.js"
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/versado-browser/node_modules/playwright" >> "$GITHUB_ENV"
      - name: Geïsoleerde migratie, privacy, conflicten, reader, hervatten en expliciet gelezen
        run: |
          npm run test:study-reader:integration
          npm run test:study-read:integration
      - name: Gepinde gepubliceerde leswoordpools zonder gameplay
        run: node scripts/content-architecture/test-access-isolated.mjs --focused --lesson-word-pools
      - name: Concrete spelresolvers en bevroren Woordzoekerbron
        run: node scripts/content-architecture/test-access-isolated.mjs --focused --game-resolver
      - name: Studieprogrammacontext in Vandaag, Leren en Spelen
        run: node scripts/content-architecture/test-access-isolated.mjs --focused --program-integration --browser
      - name: Browserbewijs bewaren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: study-reader-browser
          path: |
            /tmp/versado-study-reader-browser
            /tmp/versado-study-read-browser
            /tmp/versado-program-browser
          if-no-files-found: ignore

  reference-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://validation:validation@127.0.0.1:1/validation
      NEXT_TELEMETRY_DISABLED: '1'
      SESSION_SECRET: reference-preview-ci-build-only-secret
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Schema, types, resolverbewijs en schone productiebuild
        run: |
          npx prisma validate
          npm run db:generate
