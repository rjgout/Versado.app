      - 'src/lib/contentSwitch.ts'
      - 'src/lib/contentCollections.ts'
      - 'src/lib/navigationHistory.ts'
      - 'tests/content-picker.browser.mjs'
      - 'tests/game-availability.socket.mjs'
      - 'src/lib/gameAvailability*.ts'
      - 'src/server/**'
      - 'src/components/WordSearchClient.tsx'
      - 'src/app/globals.css'
      - 'src/app/layout.tsx'
      - 'tests/header-wordsearch.browser.mjs'
      - 'tests/profile-guide.browser.mjs'
      - 'src/components/ProfileClient.tsx'
      - 'src/components/versado/CompanionPicker.tsx'
      - 'src/lib/profileViews.ts'
      - 'tests/shell-layout.test.ts'
      - 'scripts/layout-audit/test-isolated.mjs'
      - 'package*.json'
      - '.github/workflows/header-wordsearch.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/components/StickyHeader.tsx'
      - 'src/components/BottomNav.tsx'
      - 'src/components/SortableList.tsx'
      - 'src/components/CoursesClient.tsx'
      - 'src/components/LiveLobbyForm.tsx'
      - 'src/components/versado/useCardListSave.ts'
      - 'src/lib/listOrder.ts'
      - 'tests/cards.test.ts'
      - 'tests/card-management.browser.mjs'
      - 'src/components/versado/ContentCard.tsx'
      - 'src/components/ContentSwitcher.tsx'
      - 'src/components/LiveDataProvider.tsx'
      - 'src/lib/data/hooks.ts'
      - 'src/lib/focusMode.ts'
      - 'src/components/SubpageBackBar.tsx'
      - 'src/lib/i18n/messages/**'
      - 'src/components/content/**'
      - 'src/app/content/**'
      - 'src/lib/contentPickerContract.ts'
      - 'src/lib/contentSwitch.ts'
      - 'src/lib/contentCollections.ts'
      - 'src/lib/navigationHistory.ts'
      - 'tests/content-picker.browser.mjs'
      - 'tests/game-availability.socket.mjs'
      - 'src/lib/gameAvailability*.ts'
      - 'src/server/**'
      - 'src/components/WordSearchClient.tsx'
      - 'src/app/globals.css'
      - 'src/app/layout.tsx'
      - 'tests/header-wordsearch.browser.mjs'
      - 'tests/profile-guide.browser.mjs'
      - 'src/components/ProfileClient.tsx'
      - 'src/components/versado/CompanionPicker.tsx'
      - 'src/lib/profileViews.ts'
      - 'tests/shell-layout.test.ts'
      - 'scripts/layout-audit/test-isolated.mjs'
      - 'package*.json'
      - '.github/workflows/header-wordsearch.yml'
  workflow_dispatch:

permissions:
  contents: read

# Actuele main heeft voor volledige TypeScript-controle meer dan 2 GiB heap nodig.
# Geen typechecks overslaan; begrens alleen de build-/testprocessen op 4 GiB.
env:
  NODE_OPTIONS: --max-old-space-size=4096
jobs:
  layout-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Productiebuild
        run: |
          npm run db:generate
          npm run build
      - name: Browser klaarzetten
        run: |
          npm install --prefix "$RUNNER_TEMP/versado-browser" playwright@1.64.0
          bash scripts/ci/install-browser.sh node "$RUNNER_TEMP/versado-browser/node_modules/playwright/cli.js"
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/versado-browser/node_modules/playwright" >> "$GITHUB_ENV"
      - name: Echte layout en Woordzoeker met wegwerpdatabase
        run: npm run test:layout:browser
      - name: Shell, generator, types, lint en vertalingen
        run: |
          npm run test:focus
          npm run test:word-search
          npx tsc --noEmit
          npm run lint
          npx tsx scripts/i18n/check.ts
      - name: Browserbewijs bewaren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: header-wordsearch-browser
          path: /tmp/versado-layout-browser
          if-no-files-found: warn
          retention-days: 7
