<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1565c0" />
    <title>Versado is even niet bereikbaar</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
        background: #f8fafc;
        color: #0f172a;
      }
      main { width: min(100%, 28rem); text-align: center; }
      img { width: 72px; height: 72px; border-radius: 18px; margin-bottom: 24px; }
      h1 { margin: 0 0 12px; font-size: 1.5rem; line-height: 1.2; }
      p { margin: 0 auto 24px; color: #475569; line-height: 1.5; }
      button { border: 0; border-radius: 999px; padding: 12px 20px; background: #1565c0; color: white; font: inherit; font-weight: 700; }
      @media (prefers-color-scheme: dark) {
        body { background: #0f172a; color: #f8fafc; }
        p { color: #cbd5e1; }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="Versado" />
      <h1>Versado is even niet bereikbaar</h1>
      <p>Controleer je verbinding en probeer het opnieuw. Je voortgang staat veilig op de Versado-server.</p>
      <button type="button" onclick="location.reload()">Opnieuw proberen</button>
    </main>
  </body>
</html>
