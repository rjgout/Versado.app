<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>We maken Versado even beter</title>
<style>
  :root {
    color-scheme: light;
    --background: #f1f7fd;
    --background-glow: rgba(116, 179, 238, 0.2);
    --foreground: #102a43;
    --muted: #5d7187;
    --line: rgba(87, 129, 168, 0.2);
    --accent: #287dc1;
    --track: #d6e7f5;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --background: #111d2d;
      --background-glow: rgba(65, 133, 196, 0.16);
      --foreground: #f3f7fb;
      --muted: #afc0d2;
      --line: rgba(173, 198, 222, 0.18);
      --accent: #78b8eb;
      --track: #29425d;
    }
  }

  * { box-sizing: border-box; }

  html {
    min-height: 100%;
    background: var(--background);
  }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    margin: 0;
    overflow-x: hidden;
    background:
      radial-gradient(circle at 50% 22%, var(--background-glow), transparent 35rem),
      var(--background);
    color: var(--foreground);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  .screen {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: max(28px, env(safe-area-inset-top))
      max(20px, env(safe-area-inset-right))
      max(28px, env(safe-area-inset-bottom))
      max(20px, env(safe-area-inset-left));
  }

  .content {
    width: min(100%, 580px);
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .brand {
    min-height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: clamp(26px, 5vh, 52px);
  }

  .brand img {
    display: block;
    width: auto;
    max-width: min(220px, 72vw);
    max-height: 48px;
    object-fit: contain;
  }

  /* Alleen actief als de gedeelde Huisstijl-kopie nog niet bestaat. */
  .brand-fallback {
    color: var(--accent);
    font-size: 1.35rem;
    font-weight: 800;
    letter-spacing: -0.03em;
  }

  .family {
    display: block;
    width: min(100%, 330px);
    height: auto;
    margin: 0 auto clamp(28px, 5vh, 48px);
    object-fit: contain;
  }

  h1 {
    max-width: 520px;
    margin: 0;
    color: var(--foreground);
    font-size: clamp(1.75rem, 5vw, 2.45rem);
    line-height: 1.12;
    letter-spacing: -0.035em;
  }

  .intro {
    max-width: 500px;
    margin: 16px auto 0;
    color: var(--muted);
    font-size: clamp(1rem, 2.5vw, 1.1rem);
    line-height: 1.6;
  }

  .status {
    width: min(100%, 360px);
    margin: 32px auto 0;
  }

  .scanner {
    position: relative;
    height: 10px;
    overflow: hidden;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--track);
  }

  .scanner-beam {
    position: absolute;
    top: 1px;
    bottom: 1px;
    left: 1px;
    width: 30%;
    border-radius: inherit;
    background: var(--accent);
    box-shadow: 0 0 14px rgba(40, 125, 193, 0.45);
    animation: scan 4.8s ease-in-out infinite alternate;
  }

  .status-text {
    margin: 12px 0 0;
    color: var(--muted);
    font-size: 0.88rem;
    line-height: 1.4;
  }

  .reassurance {
    margin: 28px 0 0;
    color: var(--muted);
    font-size: 0.9rem;
  }

  @keyframes scan {
    from { transform: translateX(0); }
    to { transform: translateX(230%); }
  }

  @media (min-width: 700px) {
    .family { width: min(100%, 390px); }
  }

  @media (prefers-reduced-motion: reduce) {
    .scanner-beam {
      animation: none;
      transform: translateX(115%);
      box-shadow: none;
    }
  }
</style>
</head>
<body>
  <main class="screen">
    <div class="content">
      <div class="brand" role="img" aria-label="Versado">
        <img id="header-logo" src="/maintenance-assets/header-logo.png" alt="">
        <span id="header-logo-fallback" class="brand-fallback" hidden>Versado</span>
      </div>

      <img
        class="family"
        src="/maintenance-assets/family-support.webp"
        alt=""
        aria-hidden="true"
      >

      <h1>We maken Versado even beter</h1>
      <p class="intro">We werken heel even aan een korte update.<br>Je komt automatisch terug zodra alles klaar is.</p>

      <div class="status" role="status" aria-live="polite">
        <div class="scanner" aria-hidden="true"><span class="scanner-beam"></span></div>
        <p class="status-text">Versado komt zo weer terug.</p>
      </div>

      <p class="reassurance">Je hoeft niets te verversen.</p>
    </div>
  </main>

  <script>
    (function () {
      var logo = document.getElementById("header-logo");
      var fallback = document.getElementById("header-logo-fallback");
      var probeInFlight = false;

      if (logo && fallback) {
        logo.addEventListener("error", function () {
          logo.hidden = true;
          fallback.hidden = false;
        });
      }

      window.setInterval(function () {
        if (probeInFlight) return;
        probeInFlight = true;
        fetch("/__maintenance-probe", { method: "GET", cache: "no-store", credentials: "omit" })
          .then(function (response) {
            if (response.ok) window.location.reload();
          })
          .catch(function () {
            // De app is nog niet gezond; probeer het bij de volgende interval opnieuw.
          })
          .finally(function () {
            probeInFlight = false;
          });
      }, 5000);
    })();
  </script>
</body>
</html>
