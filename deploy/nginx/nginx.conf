worker_processes 1;
events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  access_log    off;

  # Nodig zodat WebSocket-verbindingen (de live multiplayer-quiz via
  # Socket.io) door deze proxy heen blijven werken: zonder deze map blijft
  # de Connection-header altijd "upgrade" staan, ook voor gewone
  # HTTP-verzoeken zonder Upgrade-header, wat sommige clients breekt.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
  }

  server {
    listen 80;
    server_tokens off;

    # Basisbeveiliging voor alle publieke responses. CSP en HSTS blijven
    # bewust apart: CSP vraagt een inventarisatie van alle script/resource
    # bronnen en HSTS hoort alleen aan te staan zodra HTTPS voor alle
    # betrokken hosts gegarandeerd is.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root /usr/share/nginx/html;

    # Deze bestanden vallen buiten de onderhoudsvlag. De familie-illustratie
    # zit in de proxy-image; het headerlogo komt uit de gedeelde, laatst bekende
    # Huisstijl-kopie. Zo kan maintenance.html zelfstandig renderen.
    location ^~ /maintenance-assets/ {
      try_files $uri =404;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /maintenance-assets/header-logo.png {
      alias /branding/header-logo.png;
      add_header Cache-Control "no-store, max-age=0, must-revalidate" always;
    }

    # Exacte probe omzeilt uitsluitend de maintenance-gate en controleert de
    # echte health-route. De gewone app-URL blijft tijdens onderhoud 503.
    location = /__maintenance-probe {
      proxy_pass http://jehova-app:3000/api/health;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_intercept_errors off;
      proxy_read_timeout 5s;
      add_header Cache-Control "no-store, max-age=0, must-revalidate" always;
    }

    # Browsers vragen /favicon.ico vaak rechtstreeks op en negeren daarbij
    # soms de dynamische link uit de HTML. Laat ook dat vaste pad de branding
    # uit de app halen, anders wint het groene standaardicoon van de proxy.
    location = /favicon.ico {
      proxy_pass http://jehova-app:3000/api/branding/favicon;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /apple-touch-icon.png {
      proxy_pass http://jehova-app:3000/api/branding/apple-touch-icon;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Het vlagbestand (aan/uit gezet door de deploy-agent, zie
    # deploy/agent/server.js) bepaalt of bezoekers de app of de
    # onderhoudspagina zien — nginx checkt dit per verzoek, dus geen reload
    # nodig om te wisselen.
    location / {
      if (-f /flag/maintenance.on) {
        return 503;
      }

      proxy_pass http://jehova-app:3000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      # Host bewust doorgeven zoals nginx 'm ontving (dus zoals cloudflared
      # 'm aanlevert) — X-Forwarded-Proto/-Host worden bewust NIET hier
      # gezet: die laten we ongewijzigd doorstromen vanaf cloudflared naar
      # de app, precies zoals dat vóór deze proxy ook al werkte (zie
      # detectAppUrlFromHeaders() in src/app/layout.tsx).
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      # Lang genoeg voor langlopende WebSocket-verbindingen (live-quiz).
      proxy_read_timeout 3600s;

      # Extra vangnet: als de vlag per ongeluk uit staat terwijl de app zelf
      # toch niet reageert (crash, nog niet gezond), toon dan alsnog de
      # nette pagina in plaats van een kale foutmelding.
      proxy_intercept_errors on;
      error_page 502 503 504 = @maintenance;
    }

    location @maintenance {
      internal;
      rewrite ^ /maintenance.html break;
    }
  }
}
