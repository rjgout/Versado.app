# Stack voor Portainer (of Container Manager) op je NAS.
#
# ⚠️ Kom je van de oude "bom-game"-naamgeving? Migreer eerst je data,
# vóórdat je deze stack (opnieuw) deployt:
#   1. Stop de huidige stack in Portainer (Stacks -> bom-game -> Stop).
#   2. Verplaats op de NAS (via File Station of SSH) de map
#      /volume1/docker/bom-game naar /volume1/docker/jehova-app — dus
#      inclusief de "postgres"-submap met al je bestaande data.
#   3. Deploy deze (bijgewerkte) stack. De Postgres-gebruiker/database heten
#      bewust nog steeds "bom" (zie environment hieronder) — dat is voor
#      niemand zichtbaar en hoeft dus niet mee te veranderen.
#   4. Controleer dat inloggen en je bestaande voortgang nog werken voordat
#      je de oude map op de NAS opruimt.
#
# Gebruik (nieuwe installatie):
#   1. Vervang hieronder elke *_PASSWORD/SECRET-placeholder door je eigen
#      waarde (zoek ze op met Ctrl+F — sommige komen op 2-3 plekken voor en
#      moeten daar allemaal hetzelfde zijn).
#   2. Plak dit in Portainer: Stacks -> Add stack -> Web editor -> plak ->
#      Deploy the stack.
#   3. Wijs je eigen reverse proxy / Cloudflare Tunnel naar de poort die je
#      hieronder bij "jehova-proxy" instelt (niet meer rechtstreeks naar
#      jehova-app — zie de toelichting daar).
#
# Updates: zie docs/DEPLOY-SYNOLOGY.md voor de aanbevolen weg (de
# "Deployen"-knop in /adminbackend, met onderhoudspagina + automatische
# rollback bij een mislukte update). Portainer's eigen "Pull and redeploy"
# blijft ook werken, maar zonder die onderhoudsgate.

services:
  # Enige onderdeel dat van buitenaf (via je Cloudflare Tunnel) bereikbaar
  # is. Blijft altijd actief, ook terwijl jehova-app hieronder ververst
  # wordt — daardoor ziet Cloudflare nooit een dichte poort/foutpagina
  # tijdens een update. Zie docs/DEPLOY-SYNOLOGY.md.
  jehova-proxy:
    image: ghcr.io/rjgout/jehova-proxy:latest
    container_name: jehova-proxy
    restart: unless-stopped
    ports:
      # Pas de "2402" hier aan naar de poort die je Cloudflare Tunnel al
      # gebruikt (dit was voorheen rechtstreeks op jehova-app gepubliceerd).
      - "2402:80"
    depends_on:
      - jehova-app
    volumes:
      - maintenance_flag:/flag:ro
      - branding_assets:/branding:ro

  jehova-app:
    image: ghcr.io/rjgout/jehova-app:latest
    container_name: jehova-app
    restart: unless-stopped
    # Bewust GEEN "ports" meer hier: jehova-proxy hierboven is nu het enige
    # dat van buitenaf bereikbaar is; jehova-app is alleen nog intern op het
    # Docker-netwerk bereikbaar (als "jehova-app:3000").
    environment:
      # De gebruiker/database heten bewust nog "bom" — zie de migratienotitie
      # bovenaan dit bestand voor waarom dat niet hoeft te veranderen.
      DATABASE_URL: postgresql://bom:CHANGE_THIS_DB_PASSWORD@jehova-db:5432/bom?schema=public
      REDIS_URL: redis://:CHANGE_THIS_REDIS_PASSWORD@jehova-redis:6379
      SESSION_SECRET: CHANGE_THIS_TO_A_LONG_RANDOM_STRING
      PORT: 3000
      # Zet tijdelijk op "true" als je test via een plain-http-adres (bv.
      # het LAN-IP van je NAS) — anders blijft inloggen hangen omdat de
      # browser een Secure-cookie negeert zonder https. Weer op "false"
      # zetten (of de regel weghalen) zodra je via je https-domein test.
      ALLOW_INSECURE_COOKIES: "false"
      # Optioneel: alleen nodig als de links in bevestigings-/resetmails niet
      # vanzelf het juiste adres krijgen (zie .env.example). SMTP-instellingen
      # zelf stel je in via /adminbackend in de app, niet hier.
      # APP_URL: "https://jehova.jouwdomein.nl"
      # Voor het "Nu deployen"/"Onderhoudsmodus"/"Rollback"-paneel in
      # /adminbackend — zelfde geheim als hieronder bij jehova-deploy.
      DEPLOY_AGENT_URL: "http://jehova-deploy:4000"
      DEPLOY_AGENT_TOKEN: CHANGE_THIS_TO_A_DIFFERENT_LONG_RANDOM_STRING
      # Laat Huisstijl het laatst opgeslagen headerlogo delen met de proxy,
      # zodat de onderhoudspagina zonder Next.js kan blijven tekenen.
      BRANDING_ASSET_DIR: /data/branding
    volumes:
      # Eigen kopie van de voorgelezen hoofdstukken (ruim een gigabyte per
      # taal), gevuld bij "Inhoud opnieuw laden" in /adminbackend. Op de NAS
      # zelf, zodat een nieuwe image de bestanden niet opnieuw hoeft te halen.
      - /volume1/docker/jehova-app/audio:/data/audio
      - branding_assets:/data/branding
    depends_on:
      jehova-db:
        condition: service_healthy
      jehova-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  # Voert namens /adminbackend de daadwerkelijke deploy-pijplijn uit (pullen,
  # jehova-app vervangen, healthcheck, evt. terugrollen). Heeft daarvoor
  # toegang tot de Docker-daemon nodig (de gemounte socket hieronder) — dus
  # geen host-poort, alleen intern bereikbaar, en elk verzoek moet
  # AGENT_TOKEN meesturen. Zie deploy/agent/server.js en
  # docs/DEPLOY-SYNOLOGY.md voor de precieze werking en de afwegingen
  # hierbij.
  jehova-deploy:
    image: ghcr.io/rjgout/jehova-deploy-agent:latest
    container_name: jehova-deploy
    restart: unless-stopped
    environment:
      AGENT_TOKEN: CHANGE_THIS_TO_A_DIFFERENT_LONG_RANDOM_STRING
      APP_CONTAINER_NAME: jehova-app
      APP_IMAGE: ghcr.io/rjgout/jehova-app:latest
      # Fallback voor legacy containers zonder DATABASE_URL in hun
      # inspect-configuratie. Gebruik hetzelfde wachtwoord als hierboven.
      APP_DATABASE_URL: postgresql://bom:CHANGE_THIS_DB_PASSWORD@jehova-db:5432/bom?schema=public
      APP_BRANDING_VOLUME: branding_assets
      APP_BRANDING_DESTINATION: /data/branding
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - maintenance_flag:/flag
      - deploy_state:/state

  jehova-db:
    image: postgres:16-alpine
    container_name: jehova-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: bom
      POSTGRES_PASSWORD: CHANGE_THIS_DB_PASSWORD
      POSTGRES_DB: bom
    volumes:
      - /volume1/docker/jehova-app/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bom -d bom"]
      interval: 10s
      timeout: 5s
      retries: 5

  jehova-redis:
    image: redis:7-alpine
    container_name: jehova-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "CHANGE_THIS_REDIS_PASSWORD", "--appendonly", "no"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a CHANGE_THIS_REDIS_PASSWORD ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  # Bestandsvlag (aan/uit) waarmee jehova-proxy bepaalt of bezoekers de app
  # of de onderhoudspagina zien; alleen jehova-deploy schrijft erin.
  maintenance_flag:
  # Laatste headerlogo uit Huisstijl; blijft beschikbaar terwijl jehova-app
  # tijdelijk wordt vervangen of nog niet gezond is.
  branding_assets:
  # Onthoudt welke image-versie voor het laatst gezond bevestigd is, voor
  # een handmatige rollback los van een mislukte deploy.
  deploy_state:
