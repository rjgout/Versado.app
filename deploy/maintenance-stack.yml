# Onderhoudscontainer voor cursusdiagnose en -herstel (zie docs/DEPLOY-SYNOLOGY.md, "Cursusonderhoud"). Een APARTE Portainer-stack
# naast de hoofdstack: hij start nooit vanzelf iets, is niet bereikbaar van buiten en wordt na gebruik verwijderd.
#
# Stackvariabelen (Portainer: "Environment variables"):
#   MAINTENANCE_DATABASE_URL  de DATABASE_URL van jehova-app (zelfde database, zelfde gebruiker; kopieer uit de jehova-app-container)
#   JEHOVA_NETWORK            de naam van het Docker-netwerk van de hoofdstack (Portainer -> Networks, bv. jehova-app_default)
#
# Bewust NIET aanwezig: poorten, volumes, Docker-socket, restart-beleid. Er is dus niets om te beschadigen of aan te vallen;
# de container doet alleen wat je er zelf in uitvoert.
services:
  jehova-maintenance:
    image: ghcr.io/rjgout/jehova-maintenance:latest
    container_name: jehova-maintenance
    restart: "no"
    # Blijft draaiende zodat je in Portainer een Console kunt openen; de image zelf start niets.
    command: ["tail", "-f", "/dev/null"]
    environment:
      DATABASE_URL: ${MAINTENANCE_DATABASE_URL:?Zet MAINTENANCE_DATABASE_URL op de DATABASE_URL van jehova-app}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - jehova

networks:
  jehova:
    external: true
    name: ${JEHOVA_NETWORK:?Zet JEHOVA_NETWORK op de netwerknaam van de hoofdstack}
