appId: app.versado.poc
---
# Met een grotere systeemtekstgrootte (Dynamic Type / lettergrootte van Android) blijft de selectie werken
- launchApp
- tapOn: "Lezen"
- extendedWaitUntil:
    visible:
      id: chapter-text
    timeout: 60000
- takeScreenshot: 19-systeemtekst-groot
- runFlow: _selecteer-woord.yaml
- takeScreenshot: 20-systeemtekst-woord
# De bediening (hoogstens 45% van het scherm) scrolt zelf; schuif haar omhoog tot de testknop in beeld is.
- swipe:
    start: "50%,40%"
    end: "50%,8%"
- swipe:
    start: "50%,40%"
    end: "50%,8%"
- swipe:
    start: "50%,40%"
    end: "50%,8%"
- tapOn:
    id: debug-select-5-7
- extendedWaitUntil:
    visible: "Selectie: .* · vers 5–7"
    timeout: 15000
