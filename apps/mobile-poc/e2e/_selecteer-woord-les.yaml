appId: app.versado.poc
---
# Lang indrukken selecteert een woord. Op witruimte (tussen woorden, tussen alinea's, achter een regeleinde) selecteert het
# besturingssysteem bewust niets; daarom volgt een reeks terugvalpunten over het hele tekstgebied, zodat dit bij elke lettergrootte
# en systeemtekstgrootte (waarbij het tekstgebied kleiner wordt en de regels verschuiven) een woord raakt.
- longPressOn:
    point: "50%,52%"
- runFlow:
    when:
      notVisible: "Selectie: «[^»\\s]+» · 1 blok"
    commands:
      - longPressOn:
          point: "30%,60%"
- runFlow:
    when:
      notVisible: "Selectie: «[^»\\s]+» · 1 blok"
    commands:
      - longPressOn:
          point: "70%,66%"
