appId: app.versado.poc
---
# De installatie is vers (geen oude sessie); clearState zou een nog opstartende app midden in het laden herstarten.
- launchApp
- extendedWaitUntil:
    visible:
      id: login-submit
    timeout: 240000
- takeScreenshot: 01-login-scherm
- tapOn:
    id: login-id
- inputText: alice@example.invalid
- tapOn:
    id: login-password
- inputText: PocPassw0rd!2026
- hideKeyboard:
    optional: true
- tapOn:
    id: login-submit
# iOS toont na het inloggen het systeemvenster "Save Password?"; dat bedekt de app voor de UI-test.
- extendedWaitUntil:
    visible: "Not Now"
    timeout: 40000
    optional: true
- tapOn:
    text: "Not Now"
    optional: true
# Vandaag met echte backendgegevens
- extendedWaitUntil:
    visible:
      id: vandaag-streak
    timeout: 150000
- assertVisible: "Vandaag"
- takeScreenshot: 02-vandaag
