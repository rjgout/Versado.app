appId: app.versado.poc
---
# Opruimen én bewijs dat wissen werkt: markering op vers 5–7 weg, notitie blijft
- launchApp
- extendedWaitUntil:
    visible: "Lezen"
    timeout: 120000
- tapOn: "Lezen"
- extendedWaitUntil:
    visible: "Markeringen: vers 5, 6, 7"
    timeout: 60000
- tapOn:
    id: debug-select-5-7
- extendedWaitUntil:
    visible: "Selectie: .* · vers 5–7"
    timeout: 15000
- runFlow:
    file: _opslaan.yaml
    env:
      TAP_ID: unmark-button
      EXPECT: "Markering gewist: vers 5–7"
- assertVisible: "Markeringen: geen"
- assertVisible: "Notitie vers 8: Proefnotitie bij vers 8"
- takeScreenshot: 21-markering-gewist
