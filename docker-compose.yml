# Generieke self-hosting opzet: bouwt de image lokaal uit de broncode en
# start de volledige stack met één commando:
#
#   cp .env.example .env   # eenmalig, vul de waarden in
#   docker compose up -d --build
#
# Zet zelf een reverse proxy (Cloudflare Tunnel, Nginx, Caddy, Traefik, ...)
# voor poort 3000 als je de app publiek bereikbaar wil maken onder je eigen
# domein — deze compose-file is daar bewust neutraal in.
#
# jehova-proxy hieronder is een lichte, altijd-actieve nginx die tussen die
# reverse proxy en jehova-app in staat, en tijdens een herstart van
# jehova-app (bv. na een `docker compose up -d --build`) een nette
# onderhoudspagina toont in plaats van een verbroken verbinding — zie
# deploy/nginx/ en docs/DEPLOY-SYNOLOGY.md. Onderhoudsmodus zet je hier
# handmatig aan/uit met de kanttekening hieronder; het volledige
# geautomatiseerde "pull -> healthcheck -> wisselen/rollback"-paneel in
# /adminbackend is (nog) specifiek voor de vooraf-gebouwde-images-opzet in
# deploy/docker-compose.yml, omdat het uitgaat van een uit een registry te
# pullen image in plaats van een lokale build.
#
# Onderhoudsmodus handmatig:
#   aan:  docker compose exec jehova-proxy touch /flag/maintenance.on
#   uit:  docker compose exec jehova-proxy rm -f /flag/maintenance.on
#
# Voor het specifieke geval van een Synology NAS + Portainer (met een
# vooraf gebouwde image i.p.v. lokaal bouwen) zie deploy/docker-compose.yml
# en docs/DEPLOY-SYNOLOGY.md.

services:
  jehova-proxy:
    build: ./deploy/nginx
    container_name: jehova-proxy
    restart: unless-stopped
    depends_on:
      - jehova-app
    ports:
      - "${PORT:-3000}:80"
    volumes:
      - maintenance_flag:/flag

  jehova-app:
    build: .
    container_name: jehova-app
    restart: unless-stopped
    depends_on:
      jehova-db:
        condition: service_healthy
      jehova-redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # POSTGRES_USER/POSTGRES_DB blijven bewust "bom" als standaard: dat is
      # de gebruiker/database-naam waarmee bestaande installaties al draaien
      # (Postgres kent die namen alleen toe bij de allereerste opstart van
      # een lege datamap — wijzig dit dus niet zonder ook zelf de bestaande
      # Postgres-gebruiker/database te hernoemen, anders kan de app niet
      # meer inloggen). De containernaam hieronder is puur cosmetisch en
      # veilig om te wijzigen.
      DATABASE_URL: "postgresql://${POSTGRES_USER:-bom}:${POSTGRES_PASSWORD:?Zet POSTGRES_PASSWORD in .env}@jehova-db:5432/${POSTGRES_DB:-bom}?schema=public"
      APP_URL: ${APP_URL:?Zet APP_URL in .env op de canonieke oorsprong}
      STUDY_MEDIA_DIR: /data/study-media
      REDIS_URL: "redis://:${REDIS_PASSWORD:?Zet REDIS_PASSWORD in .env}@jehova-redis:6379"
    volumes:
      # Eigen kopie van de voorgelezen hoofdstukken, zie AUDIO_DIR in de
      # Dockerfile en src/lib/audioMirror.ts.
      - audio_data:/data/audio
      # Eénmalig marker initialiseren; media blijven bij containervervanging bestaan.
      - study_media:/data/study-media
    # Bewust GEEN "ports" meer hier: jehova-proxy hierboven is nu het enige
    # dat van buitenaf bereikbaar is; jehova-app is alleen nog intern op het
    # Docker-netwerk bereikbaar (als "jehova-app:3000").
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:'+(process.env.PORT||3000)+'/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  jehova-db:
    image: postgres:16-alpine
    container_name: jehova-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Zet POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-bom}
    volumes:
      - jehova_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-bom} -d ${POSTGRES_DB:-bom}"]
      interval: 10s
      timeout: 5s
      retries: 5

  jehova-redis:
    image: redis:7-alpine
    container_name: jehova-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Zet REDIS_PASSWORD in .env}", "--appendonly", "no"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Zet REDIS_PASSWORD in .env}

volumes:
  # Persistente data (gebruikers, voortgang, XP, streaks, freezes, vrienden,
  # competitie, spelresultaten, content) staat hier — NIET in de jehova-app
  # container. Een container verwijderen en opnieuw starten (zonder deze
  # volume te verwijderen) laat alle data intact.
  #
  # LET OP bij een bestaande installatie die nog de oude volumenaam
  # "bom_db_data" gebruikt: Docker maakt bij een naamswijziging een NIEUWE
  # lege volume aan in plaats van de oude te hergebruiken. Migreer eerst de
  # data (bv. `docker run --rm -v bom_db_data:/from -v jehova_db_data:/to
  # alpine sh -c "cp -a /from/. /to/"` met beide containers gestopt) vóórdat
  # je deze compose-file met de nieuwe naam opnieuw opstart.
  jehova_db_data:
  # Voorgelezen hoofdstukken (kopie van de kerkaudio). Verloren gaan is niet
  # erg: de volgende contentlading haalt ze opnieuw op.
  audio_data:
  study_media:
  # Bestandsvlag waarmee jehova-proxy bepaalt of bezoekers de app of de
  # onderhoudspagina zien (zie de toelichting bovenaan dit bestand).
  maintenance_flag:
